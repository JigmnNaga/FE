
name: Android CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Download Gradle distribution with retries
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            delay=$((10 * attempt))
            echo "::warning::Gradle bootstrap failed; retrying in ${delay}s (attempt ${attempt}/3)."
            sleep "$delay"
          done

      - name: Build and Test
        run: ./gradlew assembleDevDebug testDevDebugUnitTest --no-daemon